[package]
name = "drift-linalg"
version = "1.0.0"
edition = "2021"
description = "Component-wise compensated vector accumulation built on Neumaier summation"
authors = ["Armonti Du-Bose-Hill <armonti@onlysg.solutions>"]
license = "Apache-2.0"
readme = "README.md"
keywords = ["physics", "deterministic", "linear-algebra", "game-engine", "numerics"]
categories = ["mathematics", "simulation", "game-engines"]

[features]
default = []
# Serialization is opt-in. We do not impose it on the physics kernel.
serialization = ["dep:serde"]

[dependencies]
# Immutable Kernel mainline source with Neumaier/Debug/Clone (v1.0.0 tag lacks these).
# Replace with a newly verified release tag only after an explicit compatibility check.
drift-kernel = { git = "https://github.com/aduboseh/drift-kernel.git", rev = "9ac4bae6ea02eaccfbb2a7ebfce25dc3b594fc21" }
serde = { version = "1.0", optional = true, features = ["derive"] }

[dev-dependencies]
