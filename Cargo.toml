[package]
name = "drift-linalg"
version = "1.0.0"
edition = "2021"
description = "Component-wise compensated vector accumulation built on Neumaier summation"
authors = ["Armonti Du-Bose-Hill <armonti@onlysg.solutions>"]
license = "Apache-2.0"
readme = "README.md"
keywords = ["physics", "deterministic", "linear-algebra", "game-engine", "numerics"]
categories = ["mathematics", "simulation", "game-engines"]

[features]
default = []
# Serialization is opt-in. We do not impose it on the physics kernel.
serialization = ["dep:serde"]

[dependencies]
# Review-branch integration pin: immutable Kernel revision with Neumaier/Debug/Clone.
# Replace with a verified new release tag after the Kernel PR passes and is merged.
drift-kernel = { git = "https://github.com/aduboseh/drift-kernel.git", rev = "09275dd34d62958860595bb5017080ff751047fa" }
serde = { version = "1.0", optional = true, features = ["derive"] }

[dev-dependencies]
